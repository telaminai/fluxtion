site_name: Fluxtion continuous decisions
site_description: continuous decisions library for Java
site_url: https://telaminai.github.io/fluxtion/
repo_url: https://github.com/telaminai/fluxtion
repo_name: telaminai/fluxtion
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.sections
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: blue
      accent: indigo

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.critic
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tilde
  - attr_list
  - tables

plugins:
  - search
  - mermaid2
  - awesome-pages
  - macros

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/telaminai
  # Define variables here
  fluxtion_src_runtime: https://github.com/telaminai/fluxtion/tree/main/fluxtion-runtime/src/main/java/com/telamin/fluxtion/runtime
  # The builder API is public and lives in this repository; the compiler that consumes it is not,
  # which is why there is no fluxtion_src_compiler - the six links that used it pointed nowhere.
  fluxtion_src_builder: https://github.com/telaminai/fluxtion/tree/main/fluxtion-builder-api/src/main/java/com/telamin/fluxtion/builder
  fluxtion_example_src: https://github.com/telaminai/fluxtion-examples/tree/main
  # Single source of truth for the Fluxtion versions and notes shown in the docs and READMEs. Pages
  # use the macros; README.md files and docs/claude.txt carry literal versions and generated note
  # blocks stamped by `python3 scripts/check-doc-versions.py --write`. CI runs it without --write,
  # so drift fails the build. Keep single-line values on one line (the script parses this block).
  fluxtion_runtime_version: 1.1.4   # fluxtion-runtime, fluxtion-builder-api
  fluxtion_builder_version: 1.0.90  # fluxtion-builder, fluxtion-bom, fluxtion-starter-core
  fluxtion_maven_plugin_version: 1.3.4   # com.telamin.fluxtion:fluxtion-maven-plugin (Maven Central)
  fluxtion_repository: https://repo.repsy.io/mvn/fluxtion/fluxtion-public
  # The managed compiler's public address: the default for sign-in and builds, so the docs name it only where a
  # different compiler is discussed. Pages use the macro; README.md files and claude.txt carry it literally, and
  # check-doc-versions.py fails on any other compiler.* address.
  fluxtion_compiler_url: https://compiler.fluxtion-playground.dev
  # Where a reader learns to sign in. The quickstart page also keeps the retired anchor
  # #1-getting-an-api-key, because released builders print it; check-doc-versions.py checks both.
  fluxtion_sign_in_how_to: https://telaminai.github.io/fluxtion/home/quickstart-aot/#1-sign-in-to-the-compiler
  fluxtion_sign_in_line: >-
    How to sign in: [Sign in to the compiler](https://telaminai.github.io/fluxtion/home/quickstart-aot/#1-sign-in-to-the-compiler).
  # The two notes below are the same text the playground site shows (there without backticks);
  # `check-doc-versions.py --online` compares them with the deployed llms.txt.
  fluxtion_repository_note: >-
    Current runtime, builder-api, builder, BOM and starter releases are published to the Fluxtion
    public repository, https://repo.repsy.io/mvn/fluxtion/fluxtion-public - declare it. Maven Central
    has only an outdated 1.0.9 runtime and builder and no BOM; the `fluxtion-maven-plugin` is
    published to Maven Central.
  # Verbatim the playground's REMOTE_BUILD_NOTE (fluxtion-web scripts/fluxtion-coordinates.mjs): plain text, no
  # backticks, so the two sites stay identical. check-doc-versions.py --online compares them.
  fluxtion_remote_build_note: >-
    Building a graph (DataFlowBuilder...build(), interpret(), Fluxtion.compile* / compileAot or the
    fluxtion-maven-plugin) sends the graph model - not your source files - to the hosted Fluxtion compiler, and
    needs a compiler sign-in. Sign in once with mvn com.telamin.fluxtion:fluxtion-maven-plugin:login and approve
    in your browser; Maven, Gradle, JBang and a plain main then find the saved sign-in. In CI, set
    FLUXTION_API_TOKEN. Without a sign-in, a build that must generate stops before sending anything (FLX-1023).
    A generated processor runs with fluxtion-runtime alone and makes no network call.
  fluxtion_javadoc: https://javadoc.io/doc/com.telamin.fluxtion/fluxtion-runtime/latest/index.html
  release_date: "2026-06-16"

not_in_nav: |
  claude.txt


