name: docs-check

# Fails a push or pull request when a doc or README names a Fluxtion version other than the
# source of truth in mkdocs.yml (extra: fluxtion_*_version), shows a dependency without the
# Fluxtion repository, or uses an undefined fluxtion_* macro. Fix with
# `python3 scripts/check-doc-versions.py --write` or by editing mkdocs.yml.
on:
  push:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Fluxtion versions in docs and READMEs
        run: python3 scripts/check-doc-versions.py
      # Network: every pinned version must exist (Repsy for the runtime/builder line, Maven Central for
      # the plugin) - a pin that does not resolve is the failure the 2026-10-25 stranger trial hit.
      # Comparing with the deployed playground llms.txt only warns: the two sites deploy separately.
      - name: Pinned versions are published; playground agrees
        run: python3 scripts/check-doc-versions.py --online
