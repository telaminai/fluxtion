name: Release to maven central

on:
  push:
    branches:
      - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install gpg secret key
        run: |
          cat <(echo -e "${{ secrets.MAVEN_GPG_PRIVATE_KEY }}") | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - uses: actions/checkout@v4

      # JDK 8 is required at build time by fluxtion-builder-all-java8
      # (Retrolambda 2.5.7 must run under JDK 8). Installed first so the
      # release JDK (set up next) wins as JAVA_HOME; JDK 8 path is captured
      # via the setup-java-exported JAVA_HOME_8_X64.
      - name: Setup JDK 8 (for Retrolambda in fluxtion-builder-all-java8)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 8

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Set up Apache Maven Central
        uses: actions/setup-java@v4
        with: # running setup-java again overwrites the settings.xml
          java-version: '21'
          distribution: 'adopt'
          server-id: central # Value of the distributionManagement/repository/id field of the pom.xml
          server-username: MAVEN_USERNAME # env variable for username in deploy
          server-password: MAVEN_CENTRAL_TOKEN # env variable for token in deploy
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }} # Value of the GPG private key to import
          gpg-passphrase: MAVEN_GPG_PASSPHRASE # env variable for GPG private key passphrase

      - name: Configure Git user
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      # -Djdk8.home flows into release:prepare's verification build; -Darguments
      # forwards the same property into release:perform's forked inner mvn so
      # the fluxtion-builder-all-java8 Retrolambda exec finds its JDK 8.
      - name: Publish to Apache Maven Central
        run: mvn -P release -B release:prepare release:perform -Djdk8.home=$JAVA_HOME_8_X64 -Darguments="-Djdk8.home=$JAVA_HOME_8_X64"
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - uses: actions/checkout@master
      - name: Merge release -> master
        uses: devmasx/merge-branch@master
        with:
          type: now
          from_branch: release
          target_branch: main
          github_token: ${{ github.token }}

      - name: Merge release -> development
        uses: devmasx/merge-branch@master
        with:
          type: now
          from_branch: main
          target_branch: develop
          github_token: ${{ github.token }}
